name: UI fidelity audit
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  audit:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    # Audits A-E against the live site. The run is red while the site differs from Figma (one soft assertion per difference).
    - name: Run the audits
      run: npx playwright test
    # reports/index.html, one report.html per page, screenshots, details and Playwright's own report.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ui-fidelity-reports
        path: reports/
        retention-days: 30
